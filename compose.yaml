name: nexora-local
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup:local}
      MYSQL_DATABASE: nexora
      MYSQL_USER: nexora
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run setup:local}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - nexora-mysql:/var/lib/mysql
      - ./infrastructure/init-test-db.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  nexora-mysql:
