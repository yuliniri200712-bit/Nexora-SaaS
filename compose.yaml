name: nexora-local
services:
  mysql:
    image: mysql:8.4
    # Con el registro binario activo, sin esto el usuario de la aplicación no puede crear triggers.
    command: ['--log-bin-trust-function-creators=1']
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run setup:local}
      MYSQL_DATABASE: nexora_principal
      MYSQL_USER: nexora
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run setup:local}
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - nexora-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  nexora-mysql:
