name: Phase 1 checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: nexora_test
          MYSQL_USER: nexora
          MYSQL_PASSWORD: ci-ephemeral-password
          MYSQL_ROOT_PASSWORD: ci-ephemeral-root
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-ephemeral-root --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql://nexora:ci-ephemeral-password@127.0.0.1:3307/nexora_test
      TEST_DATABASE_URL: mysql://nexora:ci-ephemeral-password@127.0.0.1:3307/nexora_test
      APP_ORIGIN: http://127.0.0.1:5173
      MAIL_TRANSPORT: file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Allow triggers for the migration user
        run: mysql -h 127.0.0.1 -P 3307 -u root -pci-ephemeral-root -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: node scripts/prepare-test-db.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chrome
      - name: Browser workflow
        run: |
          node scripts/start-test-api.mjs &
          npm run dev -w @nexora/web &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/health/ready && curl -sf http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 2
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results
